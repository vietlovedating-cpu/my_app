workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60

    integrations:
      app_store_connect: vietlovedating_key

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.vietlovedating.app

    scripts:
      - name: Clean everything
        script: |
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock
          rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods fresh
        script: |
          cd ios
          pod repo update
          pod update GTMSessionFetcher/Core
          pod install --repo-update
          cd ..

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true